[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["backend/translator/migrations"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
mypy_path = "backend"
strict = true
exclude = [
    "backend/manage.py",
    "backend/translator/migrations",
    "backend/translator/test.*\\.py$",
]

[[tool.mypy.overrides]]
module = ["openai.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
